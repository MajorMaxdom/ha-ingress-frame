name: HA Ingress Frame
version: "0.1.5"
slug: ha_frame
description: Shows internal homelab websites as tabs in the Home Assistant sidebar via an ingress reverse proxy
arch:
  - aarch64
  - amd64
  - armv7
init: false
ingress: true
ingress_port: 8099
panel_icon: mdi:application-brackets-outline
panel_title: Homelab
options:
  sites:
    - name: example
      title: Beispiel
      url: https://example.lan
      verify_ssl: true
schema:
  sites:
    - name: match(^[a-z0-9_-]+$)
      title: str
      url: url
      verify_ssl: bool?
      path: str?
      strip_prefix: bool?
      cookie_root: bool?
      basic_auth: password?
